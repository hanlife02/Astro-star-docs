name: Deploy to GitHub Pages

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Astro-star commit SHA or main
        required: false
        default: main

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve source version
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          source_sha="${SOURCE_SHA:-main}"

          if [[ ! "$source_sha" =~ ^(main|[0-9a-f]{40})$ ]]; then
            echo "::error::source_sha must be 'main' or a 40-character lowercase commit SHA."
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout docs source
        id: checkout
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git init source
          git -C source remote add origin https://github.com/hanlife02/Astro-star.git
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD

          resolved_sha=$(git -C source rev-parse HEAD)
          if [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$resolved_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Resolved commit $resolved_sha does not match requested commit $SOURCE_SHA."
            exit 1
          fi

          if [ ! -f source/docs/package.json ]; then
            echo "::error::The requested Astro-star revision does not contain docs/package.json."
            exit 1
          fi

          echo "resolved_sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Check deployed source version
        id: changes
        env:
          DEPLOYED_SHA_URL: https://hanlife02.github.io/Astro-star-docs/source-sha.txt
          RESOLVED_SHA: ${{ steps.checkout.outputs.resolved_sha }}
        run: |
          deployed_sha=$(curl --fail --silent --show-error "$DEPLOYED_SHA_URL" || true)

          if [ "$deployed_sha" = "$RESOLVED_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Documentation for $RESOLVED_SHA is already deployed."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: "source/docs/.nvmrc"
          package-manager-cache: false

      - name: Setup pnpm
        if: steps.changes.outputs.deploy == 'true'
        working-directory: source/docs
        run: corepack enable

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true'
        working-directory: source/docs
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Build
        if: steps.changes.outputs.deploy == 'true'
        working-directory: source/docs
        env:
          RESOLVED_SHA: ${{ steps.checkout.outputs.resolved_sha }}
        run: |
          pnpm --ignore-workspace docs:build
          printf '%s\n' "$RESOLVED_SHA" > .vitepress/dist/source-sha.txt

      - name: Configure GitHub Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/configure-pages@v4
        id: pages

      - name: Upload Pages artifact
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/docs/.vitepress/dist

      - name: Deploy GitHub Pages
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        id: deployment
